name: Build Recipta for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Recipta
        shell: pwsh
        run: |
          wails build

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Recipta-Windows
          path: build/bin/*
